<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팻머스 정기 발송_송장번호 조회</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F5F2;
    --card:#FFFFFF;
    --ink:#1B2A32;
    --muted:#6D7A80;
    --line:#DCE0DC;
    --accent:#0E5B4F;
    --accent-soft:#E4EDEA;
    --alert:#8F3D21;
    --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --serif:"Gowun Batang","Nanum Myeongjo",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:17px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
    padding:0 20px env(safe-area-inset-bottom);
  }
  .wrap{max-width:460px;margin:0 auto;padding:48px 0 72px}

  header h1{
    font-family:var(--serif);
    font-size:29px;
    font-weight:700;
    line-height:1.35;
    margin:0 0 10px;
    letter-spacing:-.01em;
  }
  header p{margin:0;color:var(--muted);font-size:15.5px}
  .rule{height:1px;background:var(--line);margin:28px 0 30px;border:0}

  /* ── 입력 ── */
  label.field{display:block;font-size:17.5px;font-weight:600;color:var(--accent);margin:0 0 4px}
  .hint{font-size:14px;color:var(--muted);margin:0 0 14px}
  .digits{display:flex;gap:9px}
  .digits input{
    flex:1;
    min-width:0;
    height:74px;
    font-family:var(--sans);
    font-size:34px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    text-align:center;
    color:var(--ink);
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:10px;
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  .digits input::placeholder{color:#C7CDC9}
  .digits input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .digits input.filled{border-color:#B4BFB8}

  .church{margin-top:24px;display:none}
  .church.on{display:block}
  #notice:not(:empty){margin-bottom:18px}
  .church input{
    width:100%;
    height:54px;
    padding:0 15px;
    font-family:var(--sans);
    font-size:18px;
    color:var(--ink);
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:10px;
  }
  .church input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  button.go{
    width:100%;
    margin-top:22px;
    height:56px;
    font-family:var(--sans);
    font-size:18px;
    font-weight:600;
    color:#fff;
    background:var(--accent);
    border:0;
    border-radius:10px;
    cursor:pointer;
  }
  button.go:hover{background:#0B4A40}
  button.go:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}

  /* ── 결과 ── */
  #out{margin-top:34px}
  .msg{
    padding:20px 18px;
    border-radius:10px;
    font-size:16px;
    line-height:1.65;
  }
  .msg.none{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .msg.pick{background:var(--accent-soft);color:#0B4A40}
  .msg strong{color:var(--ink);font-weight:600}

  .result{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .result-head{padding:20px 20px 18px;border-bottom:1px solid var(--line)}
  .result-head h2{
    font-family:var(--serif);
    font-size:22px;
    font-weight:700;
    margin:0 0 5px;
    line-height:1.35;
  }
  .result-head p{margin:0;font-size:14.5px;color:var(--muted)}
  .count{
    margin:0;
    padding:13px 20px;
    font-size:14.5px;
    color:var(--muted);
    background:#FAFBF9;
    border-bottom:1px solid var(--line);
  }
  ol.boxes{list-style:none;margin:0;padding:0}
  ol.boxes li{padding:17px 20px;border-bottom:1px solid var(--line)}
  ol.boxes li:last-child{border-bottom:0}
  .seq{font-size:13.5px;color:var(--muted);margin-bottom:3px}
  .tn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .tn span{
    font-size:25px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
  }
  .copy{
    flex:none;
    padding:8px 13px;
    font-family:var(--sans);
    font-size:14.5px;
    font-weight:600;
    color:var(--accent);
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:8px;
    cursor:pointer;
  }
  .copy:hover{border-color:var(--accent)}
  .copy:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px}
  .copy.done{color:#fff;background:var(--accent);border-color:var(--accent)}

  a.track{
    display:block;
    padding:17px 20px;
    text-align:center;
    font-size:16.5px;
    font-weight:600;
    color:var(--accent);
    background:#FAFBF9;
    text-decoration:none;
    border-top:1px solid var(--line);
  }
  a.track:hover{background:var(--accent-soft)}

  footer{margin-top:40px;font-size:13.5px;color:var(--muted);line-height:1.7}
  footer p{margin:0 0 3px}

  @media (max-width:380px){
    .digits input{height:64px;font-size:29px}
    .tn span{font-size:22px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>

<div class="wrap">

  <header>
    <h1>팻머스 정기 발송_송장번호 조회</h1>
    <p>2026년 4권 정회원</p>
  </header>
  <hr class="rule">

  <label class="field" for="d0">휴대폰 가운데 4자리</label>

  <div class="digits">

  </div>

  <div class="church" id="churchBox">
    <div id="notice" role="status" aria-live="polite"></div>
    <label class="field" for="church">교회 이름</label>
    <p class="hint">일부만 입력하셔도 됩니다.</p>
    <input id="church" type="text" autocomplete="off" placeholder="예: 은혜">
  </div>

  <button class="go" id="go">조회하기</button>

  <div id="out" role="status" aria-live="polite"></div>

  <footer>
    <p>배송 문의 02-541-3793 · 팻머스문화선교회</p>
    <p>조회되지 않거나 정보가 다르면 사무실로 연락해 주세요.</p>
  </footer>

</div>

:"45147222643","n":"주안장로교회(유재철)-부평성전","m":"7454","a":"인천 부평구 부흥로"},{"t":"45147222654","n":"주안장로교회(유재철)-부평성전","m":"7454","a":"인천 부평구 부흥로"},{"t":"45147222665","n":"주안장로교회(유재철)-부평성전","m":"7454","a":"인천 부평구 부흥로"},{"t":"45147222676","n":"주안장로교회(유재철)-부평성전","m":"7454","a":"인천 부평구 부흥로"},{"t":"45147222680","n":"주안장로교회(유재철)-부평성전","m":"7454","a":"인천 부평구 부흥로"},{"t":"45147222691","n":"주안장로교회(유재철)-부평성전","m":"7454","a":"인천 부평구 부흥로"},{"t":"45147222702","n":"주안장로교회(유재철)-부평성전","m":"7454","a":"인천 부평구 부흥로"},{"t":"45147222713","n":"주안장로교회(유재철)-부평성전","m":"7454","a":"인천 부평구 부흥로"},{"t":"45147222724","n":"주안장로교회(유재철)-부평성전","m":"7454","a":"인천 부평구 부흥로"},{"t":"45147222735","n":"주안장로교회(유재철)-부평성전","m":"7454","a":"인천 부평구 부흥로"}];

const $ = s => document.querySelector(s);
const digits = [0,1,2,3].map(i => $("#d"+i));
const churchBox = $("#churchBox"), churchInput = $("#church");
const notice = $("#notice"), out = $("#out");

/* 4자리 입력: 자동 이동 · 붙여넣기 · 지우기 */
digits.forEach((el, i) => {
  el.addEventListener("input", () => {
    el.value = el.value.replace(/\D/g, "").slice(0, 1);
    el.classList.toggle("filled", !!el.value);
    if (el.value && i < 3) digits[i + 1].focus();
    if (mid().length < 4) reset();
  });
  el.addEventListener("keydown", e => {
    if (e.key === "Backspace" && !el.value && i > 0) { digits[i-1].focus(); digits[i-1].value=""; digits[i-1].classList.remove("filled"); e.preventDefault(); }
    if (e.key === "ArrowLeft" && i > 0) digits[i-1].focus();
    if (e.key === "ArrowRight" && i < 3) digits[i+1].focus();
    if (e.key === "Enter") search();
  });
  el.addEventListener("paste", e => {
    const t = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 4);
    if (!t) return;
    e.preventDefault();
    digits.forEach((d, k) => { d.value = t[k] || ""; d.classList.toggle("filled", !!d.value); });
    digits[Math.min(t.length, 3)].focus();
    reset();
  });
});
churchInput.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
$("#go").addEventListener("click", search);

const mid = () => digits.map(d => d.value).join("");
const baseOf    = n => n.split("(")[0].trim();
const contactOf = n => { const m = n.match(/\(([^)]*)\)/); return m ? m[1].trim() : ""; };

/* 같은 번호 안에서 교회명 본체가 같거나 담당자가 같으면 한 곳으로 묶는다
   (예: 남태령교회 / 남태령군인교회 — 담당자 동일, 속초감리교회 아동부 / 유치부) */
function groupNames(hits){
  const names = [...new Set(hits.map(r => r.n))];
  const par = names.map((_, i) => i);
  const find = x => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
  for (let i = 0; i < names.length; i++)
    for (let j = i + 1; j < names.length; j++){
      const ci = contactOf(names[i]);
      if (baseOf(names[i]) === baseOf(names[j]) || (ci && ci === contactOf(names[j])))
        par[find(i)] = find(j);
    }
  const g = new Map();
  names.forEach((n, i) => { const k = find(i); (g.get(k) || g.set(k, []).get(k)).push(n); });
  return [...g.values()];
}

function headline(names){
  if (names.length === 1) return names[0];
  const bases    = [...new Set(names.map(baseOf))];
  const contacts = [...new Set(names.map(contactOf).filter(Boolean))];
  if (bases.length === 1) return contacts.length ? `${bases[0]} (${contacts.join(" · ")})` : bases[0];
  if (contacts.length === 1) return `${bases.join(" · ")} (${contacts[0]})`;
  return names.join(" · ");
}
const norm = s => s.replace(/[\s()_·.\-]/g, "").toLowerCase();
function reset(){ out.innerHTML = ""; notice.innerHTML = ""; }

function search(){
  const m = mid();
  notice.innerHTML = "";
  if (m.length < 4){
    out.innerHTML = `<div class="msg none">가운데 4자리를 모두 입력해 주세요.</div>`;
    digits.find(d => !d.value).focus();
    return;
  }

  let hits = DATA.filter(r => r.m === m);
  if (!hits.length){
    churchBox.classList.remove("on");
    out.innerHTML = `<div class="msg none">일치하는 번호가 없습니다. 주문서에 적어주신 담당자 번호가 맞는지 확인해 주세요.</div>`;
    return;
  }

  /* 가운데 4자리가 같은 교회가 여럿이면 교회명을 함께 받는다.
     단, 담당자가 같은 곳끼리는 한 곳으로 묶어 바로 보여준다. */
  let groups = groupNames(hits);
  if (groups.length > 1){
    const q = norm(churchInput.value.trim());
    if (q.length >= 2){
      hits = hits.filter(r => norm(r.n).includes(q));
      groups = groupNames(hits);
    }
    if (groups.length !== 1){
      churchBox.classList.add("on");
      const why = q.length >= 2 && !groups.length
        ? `그 번호로는 <strong>${esc(churchInput.value.trim())}</strong>이(가) 들어간 교회가 없습니다. 다시 입력해 주세요.`
        : `이 번호를 쓰시는 교회가 <strong>${groups.length}곳</strong> 있습니다. 교회 이름을 함께 입력해 주세요.`;
      notice.innerHTML = `<div class="msg pick">${why}</div>`;
      out.innerHTML = "";
      churchInput.focus();
      return;
    }
  } else {
    churchBox.classList.remove("on");
  }

  render(hits);
}

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(hits){
  const names  = [...new Set(hits.map(r => r.n))];
  const addrs  = [...new Set(hits.map(r => r.a))];
  const split  = names.length > 1;          // 담당자가 같아 여러 교회명이 묶인 경우
  const many   = hits.length > 1;

  const items = hits.map((r, i) => {
    const label = split ? esc(r.n) : `${i+1}번째 상자`;
    return `
    <li>
      ${many ? `<div class="seq">${label}</div>` : ""}
      <div class="tn">
        <span>${esc(r.t)}</span>
        <button class="copy" type="button" data-t="${esc(r.t)}">복사</button>
      </div>
    </li>`;
  }).join("");

  const note = split
    ? `담당자가 같아 ${names.length}곳을 함께 보여드립니다. 모두 ${hits.length}상자이고 송장번호가 각각 다릅니다.`
    : `모두 ${hits.length}상자로 나갔습니다. 상자마다 송장번호가 다릅니다.`;

  out.innerHTML = `
    <div class="result">
      <div class="result-head">
        <h2>${esc(headline(names))}</h2>
        <p>${esc(addrs.join(" · "))}</p>
      </div>
      ${many ? `<p class="count">${note}</p>` : ""}
      <ol class="boxes">${items}</ol>
      <a class="track" href="${CARRIER.url(hits[0].t)}" target="_blank" rel="noopener">${CARRIER.name}에서 배송 조회</a>
    </div>`;

  out.querySelectorAll(".copy").forEach(b => {
    b.addEventListener("click", async () => {
      const t = b.dataset.t;
      try { await navigator.clipboard.writeText(t); }
      catch { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
      b.textContent = "복사됨"; b.classList.add("done");
      setTimeout(() => { b.textContent = "복사"; b.classList.remove("done"); }, 1600);
    });
  });
}

digits[0].focus();
</script>
